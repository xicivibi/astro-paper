name: Trend lifecycle rebuild

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      smoke_rebuild:
        description: "Request one Git-backed deploy to verify the host integration"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trend-lifecycle-rebuild
  cancel-in-progress: false

jobs:
  check-and-rebuild:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Verify and inspect published lifecycle
        id: check
        env:
          SITE_ORIGIN: ${{ vars.XICI_SITE_ORIGIN || 'https://xici.vercel.app' }}
        run: |
          python3 -m unittest scripts/test_check_trend_lifecycle.py
          python3 scripts/check-trend-lifecycle.py --origin "$SITE_ORIGIN" --github-output "$GITHUB_OUTPUT"
      - name: Rebuild static trend pages at lifecycle boundary
        if: steps.check.outputs.needs_rebuild == 'true' || (github.event_name == 'workflow_dispatch' && inputs.smoke_rebuild)
        env:
          SITE_ORIGIN: ${{ vars.XICI_SITE_ORIGIN || 'https://xici.vercel.app' }}
          FINGERPRINT: ${{ steps.check.outputs.fingerprint }}
        run: |
          python3 scripts/mark-trend-lifecycle.py --fingerprint "$FINGERPRINT" --state .github/trend-lifecycle-state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/trend-lifecycle-state.json
          git commit -m "Rebuild trend lifecycle $FINGERPRINT"
          git push origin HEAD:main
          for attempt in $(seq 1 15); do
            sleep 20
            if python3 scripts/check-trend-lifecycle.py --origin "$SITE_ORIGIN" > lifecycle-check.json; then
              if python3 -c 'import json; assert not json.load(open("lifecycle-check.json"))["needs_rebuild"]'; then
                exit 0
              fi
            fi
          done
          echo "A Git-backed rebuild was requested, but the live trend page is still stale." >&2
          exit 1
